workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Android folder with unique ID
        script: flutter create . --platforms=android --org com.adeljavid
      - name: Change App Name
        script: |
          sed -i 's/android:label="real_estate_app"/android:label="املاک جاوید"/g' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
